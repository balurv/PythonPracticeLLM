[project]
name = "groq-llm"
version = "0.1.0"
description = "Agent Hub: FastAPI + Groq agent orchestrator with a React frontend"
readme = "README.md"
authors = [
    { name = "balajirvenkatesh", email = "balajirvenkatesh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "mcp>=2.3.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false  # an app run with uvicorn, not an installable package

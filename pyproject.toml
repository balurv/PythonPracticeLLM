[project]
name = "groq-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "balajirvenkatesh", email = "balajirvenkatesh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "mcp>=2.3.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
groq-llm = "groq_llm:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

name: Groq Issue Agent

# Runs when the "agent" label is added to an issue (including at creation).
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  work-on-issue:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - id: agent
        run: uv run python scripts/issue_agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Ask for details
        if: steps.agent.outputs.status == 'question'
        run: gh issue comment "$ISSUE" --body-file "${{ steps.agent.outputs.summary_file }}"

      - name: Open pull request
        if: steps.agent.outputs.status == 'changed'
        env:
          SUMMARY: ${{ steps.agent.outputs.summary_file }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "$ISSUE" --body "The agent made no changes for this issue."
            exit 0
          fi
          BRANCH="agent/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Fix #$ISSUE: $TITLE"
          git push -u origin "$BRANCH" --force
          { cat "$SUMMARY"; printf '\n\nCloses #%s\n' "$ISSUE"; } > "$RUNNER_TEMP/pr_body.md"
          URL=$(gh pr create --title "Fix #$ISSUE: $TITLE" --body-file "$RUNNER_TEMP/pr_body.md")
          gh issue comment "$ISSUE" --body "Opened a pull request: $URL"
